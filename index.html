<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어 아카데미 — 준비 중</title>
<style>
  :root { --bg:#14161c; --surface:#1d2029; --text:#eef0f5; --muted:#9aa1b2; --primary:#3d8bfd; --line:#2c303c; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7fb; --surface:#ffffff; --text:#1b1e27; --muted:#5d6475; --primary:#2563eb; --line:#e1e4ec; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--text); font-family:-apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .card { width:100%; max-width:520px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:32px 24px; text-align:center; }
  .icon { font-size:56px; line-height:1; }
  h1 { margin:14px 0 6px; font-size:1.6em; }
  p { color:var(--muted); line-height:1.6; margin:8px 0; }
  .chip { display:inline-block; margin-top:6px; padding:4px 12px; border-radius:999px; background:var(--line); font-size:.9em; }
  ul { text-align:left; color:var(--muted); line-height:1.8; padding-left:22px; margin:18px 0; }
  a.btn { display:block; margin-top:22px; padding:14px; border-radius:14px; background:var(--primary); color:#fff; text-decoration:none; font-weight:700; font-size:1.05em; }
  .foot { margin-top:16px; font-size:.82em; color:var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="icon">🌍</div>
    <h1>영어 아카데미</h1>
    <span class="chip">🚧 준비 중</span>
    <p>게임처럼, 무료로 영어를 다시 시작하는 학습 사이트를 만들고 있어요.</p>
    <ul>
      <li>🔤 카드로 문장 조립 → 배열 → 직접 쓰기 → 말하기</li>
      <li>📚 단어 공간과 간격 반복 복습</li>
      <li>🎧 모든 예문은 버튼 하나로 듣기</li>
    </ul>
    <a class="btn" href="https://jihoon380462.github.io/python-academy/">🐍 파이썬 아카데미로 가기</a>
    <div class="foot">v0.0.1 · 기획서: 저장소의 SPEC.md</div>
  </main>
</body>
</html>
